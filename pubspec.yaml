name: lc3_decoder
description: "A Flutter FFI plugin for decoding LC3 (Low Complexity Communication Codec) audio with cross-platform support."
version: 0.1.0
homepage: https://github.com/voicie-com/lc3_decoder
repository: https://github.com/voicie-com/lc3_decoder
issue_tracker: https://github.com/voicie-com/lc3_decoder/issues

topics:
  - audio
  - codec
  - decoder
  - lc3
  - ffi

environment:
  sdk: ^3.10.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.1.3
  code_assets: ^1.0.0
  hooks: ^1.0.0
  logging: ^1.2.0
  native_toolchain_c: ^0.17.4

dev_dependencies:

  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0




