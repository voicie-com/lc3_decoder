name: apple

# The vendored C (liblc3 + libopus + libopusenc) is only ever built locally on
# Windows and Android, so nothing else proves it compiles and links for Apple
# targets. The iOS build is the gate that matters -- it links the arm64 device
# slice that ships -- so it runs first and is not blocked by anything else.
# `flutter test` then builds the asset for the macOS host and actually runs it.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-and-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # No-op on Flutter versions where native assets are already on by
      # default; without it, older versions silently skip hook/build.dart.
      - run: flutter config --enable-native-assets || true

      - run: flutter pub get

      - name: Link the native asset for an iOS device
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

      - name: Build and run the native asset on macOS
        run: flutter test

      # The unit tests above load the bare dylib a host build leaves behind,
      # and the iOS build only proves the library links. Running on a
      # simulator is what exercises the packaged framework actually loading
      # and the codec actually running inside an iOS app process.
      - name: Boot an iOS simulator
        id: simulator
        run: |
          # Pick whatever iPhone this runner image happens to ship rather than
          # pinning a model that a future image drops.
          udid=$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' \
            | head -1 \
            | grep -oE '[0-9A-F-]{36}')
          test -n "$udid"
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices booted

      - name: Run the transcoder on an iOS simulator
        working-directory: example
        run: flutter test integration_test -d ${{ steps.simulator.outputs.udid }}

      # The asset's filename differs per platform and build context, and
      # getting it wrong only shows up as a dlopen failure at runtime.
      - name: Show where the native asset was built
        if: always()
        run: find .dart_tool build example/build -name '*lc3_decoder*' 2>/dev/null | head -40 || true
